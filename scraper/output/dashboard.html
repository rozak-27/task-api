<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Polite Scraper — Run Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; margin-bottom: 0.25rem; }
    .sub { color: #94a3b8; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 1rem; }
    .label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
    .val { font-size: 1.6rem; font-weight: 700; margin-top: 0.25rem; color: #f8fafc; }
  </style>
</head>
<body>
  <h1>The Polite Scraper — Observability Dashboard</h1>
  <div class="sub">Last refreshed: 2026-11-25T13:26:45Z · Duration: 3.225s</div>
  <div class="grid">
    <div class="card"><div class="label">Validated Records</div><div class="val">60</div></div>
    <div class="card"><div class="label">Price Range (GBP)</div><div class="val">£12.84 – £57.31</div></div>
    <div class="card"><div class="label">Average Price</div><div class="val">£35.00</div></div>
    <div class="card"><div class="label">Cache Hits / Fetched</div><div class="val">63 / 0</div></div>
    <div class="card"><div class="label">Failed Pages</div><div class="val">1</div></div>
    <div class="card"><div class="label">Invalid Records</div><div class="val">0</div></div>
  </div>
</body>
</html>
